<div class="admin-page">
  <header class="page-header">
    <h2>{{ 'ADMIN.REC_TITLE' | translate }}</h2>
    <p>{{ 'ADMIN.REC_SUBTITLE' | translate }}</p>
  </header>

  <div *ngIf="toastMsg" class="toast-banner">{{ toastMsg }}</div>

  <div class="admin-card form-card">
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TARGET_USER' | translate }}</label>
        <select [(ngModel)]="form.userId" name="userId" required>
          <option *ngFor="let u of users" [value]="u.id">{{ u.name }} ({{ u.email }})</option>
        </select>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TITLE' | translate }}</label>
        <input type="text" [(ngModel)]="form.title" name="title" required placeholder="Ej: Ajuste de termostato nocturno" />
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label>{{ 'ADMIN.FIELD_CATEGORY' | translate }}</label>
          <input type="text" [(ngModel)]="form.category" name="category" required placeholder="Ej: Climatización, Cocina" />
        </div>
        <div class="form-group col">
          <label>{{ 'ADMIN.FIELD_SAVINGS' | translate }}</label>
          <input type="number" step="0.1" [(ngModel)]="form.estimatedSavingsKwh" name="savings" required />
        </div>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_DESCRIPTION' | translate }}</label>
        <textarea [(ngModel)]="form.description" name="description" rows="4" required placeholder="Detalla la sugerencia técnica de ahorro..."></textarea>
      </div>

      <button type="submit" class="btn-primary">{{ 'ADMIN.BTN_SEND_REC' | translate }}</button>
    </form>
  </div>
</div>
