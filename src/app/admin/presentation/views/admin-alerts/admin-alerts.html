<div class="admin-page">
  <header class="page-header">
    <h2>{{ 'ADMIN.ALERTS_TITLE' | translate }}</h2>
    <p>{{ 'ADMIN.ALERTS_SUBTITLE' | translate }}</p>
  </header>

  @if (toastMsg) {
    <div
      class="toast-banner"
      [class.toast-error]="toastIsError"
      [attr.role]="toastIsError ? 'alert' : 'status'"
    >
      {{ toastMsg }}
    </div>
  }

  <div class="admin-card form-card">
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label class="checkbox-inline" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" [(ngModel)]="form.broadcast" name="broadcast" style="width: auto;" />
          <span>{{ 'ADMIN.FIELD_BROADCAST' | translate }}</span>
        </label>
        <small style="display: block; color: #6b7280; margin-top: 4px;">
          {{ 'ADMIN.BROADCAST_HINT' | translate }}
        </small>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TARGET_USER' | translate }}</label>
        <select [(ngModel)]="form.userId" name="userId" [disabled]="form.broadcast" [required]="!form.broadcast">
          @for (u of users; track u.id) {
            <option [value]="u.id">{{ u.name }} ({{ u.email }})</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TITLE' | translate }}</label>
        <input
          type="text"
          [(ngModel)]="form.title"
          name="title"
          required
          [placeholder]="'ADMIN.ALERT_TITLE_PLACEHOLDER' | translate"
        />
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_SEVERITY' | translate }}</label>
        <select [(ngModel)]="form.severity" name="severity">
          <option value="info">{{ 'ADMIN.SEVERITY_INFO' | translate }}</option>
          <option value="warning">{{ 'ADMIN.SEVERITY_WARNING' | translate }}</option>
          <option value="critical">{{ 'ADMIN.SEVERITY_CRITICAL' | translate }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_MESSAGE' | translate }}</label>
        <textarea
          [(ngModel)]="form.description"
          name="description"
          rows="4"
          required
          [placeholder]="'ADMIN.ALERT_DESC_PLACEHOLDER' | translate"
        ></textarea>
      </div>

      <button type="submit" class="btn-primary">{{ 'ADMIN.BTN_SEND_ALERT' | translate }}</button>
    </form>
  </div>
</div>
