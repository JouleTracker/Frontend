<div class="admin-page">
  <header class="page-header">
    <h2>{{ 'ADMIN.ALERTS_TITLE' | translate }}</h2>
    <p>{{ 'ADMIN.ALERTS_SUBTITLE' | translate }}</p>
  </header>

  <div *ngIf="toastMsg" class="toast-banner">{{ toastMsg }}</div>

  <div class="admin-card form-card">
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TARGET_USER' | translate }}</label>
        <select [(ngModel)]="form.userId" name="userId" required>
          <option *ngFor="let u of users" [value]="u.id">{{ u.name }} ({{ u.email }})</option>
        </select>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_TITLE' | translate }}</label>
        <input type="text" [(ngModel)]="form.title" name="title" required placeholder="Ej: Anomalía en consumo eléctrico" />
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_SEVERITY' | translate }}</label>
        <select [(ngModel)]="form.severity" name="severity">
          <option value="info">Info</option>
          <option value="warning">Warning</option>
          <option value="critical">Critical</option>
        </select>
      </div>

      <div class="form-group">
        <label>{{ 'ADMIN.FIELD_MESSAGE' | translate }}</label>
        <textarea [(ngModel)]="form.description" name="description" rows="4" required placeholder="Mensaje que verá el usuario..."></textarea>
      </div>

      <button type="submit" class="btn-primary">{{ 'ADMIN.BTN_SEND_ALERT' | translate }}</button>
    </form>
  </div>
</div>
