<div class="recommendations-widget card-container">
  <div class="widget-header">
    <h3 class="widget-title">Recomendaciones para ti</h3>
    <a routerLink="/recomendaciones" class="view-all-link">Ver todas</a>
  </div>

  <div class="recommendations-list">
    @for (item of store.recommendations(); track item.id) {
      <div class="rec-item" [ngClass]="item.category">
        <div class="rec-icon-wrapper">
          <mat-icon class="rec-icon">
            {{ item.icon === 'eco' ? 'eco' : 'lightbulb' }}
          </mat-icon>
        </div>
        <div class="rec-content">
          <span class="rec-title">{{ item.title }}</span>
          <p class="rec-desc">{{ item.description }}</p>
        </div>
        <mat-icon class="chevron-icon">chevron_right</mat-icon>
      </div>
    }
  </div>
</div>
