<div class="chart-card">
  <div class="chart-header">
    <div class="header-left">
      <h3 class="chart-title">{{ 'CONSUMPTION.ENERGY_TITLE' | translate }}</h3>
      <span class="chart-unit">kWh</span>
    </div>
    <div class="period-selector">
      <button
        type="button"
        class="period-btn"
        [class.active]="selectedPeriod === 'dia'"
        (click)="selectPeriod('dia')">
        {{ 'CONSUMPTION.PERIOD_DAY' | translate }}
      </button>
      <button
        type="button"
        class="period-btn"
        [class.active]="selectedPeriod === 'semana'"
        (click)="selectPeriod('semana')">
        {{ 'CONSUMPTION.PERIOD_WEEK' | translate }}
      </button>
      <button
        type="button"
        class="period-btn"
        [class.active]="selectedPeriod === 'mes'"
        (click)="selectPeriod('mes')">
        {{ 'CONSUMPTION.PERIOD_MONTH' | translate }}
      </button>
      <button
        type="button"
        class="period-btn"
        [class.active]="selectedPeriod === 'ano'"
        (click)="selectPeriod('ano')">
        {{ 'CONSUMPTION.PERIOD_YEAR' | translate }}
      </button>
    </div>
  </div>

  <div class="chart-canvas-container">
    <canvas
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
</div>
