@if (isOpen) {
  <div class="goal-modal-backdrop" (click)="onClose()" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title">
    <div class="goal-modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="header-icon">
          <mat-icon>flag</mat-icon>
        </div>
        <div>
          <h2 id="goal-modal-title" class="modal-title">
            {{ goal ? 'Editar meta mensual' : 'Definir meta mensual' }}
          </h2>
          <p class="modal-subtitle">Establece tu límite objetivo de consumo en kWh para este mes.</p>
        </div>
        <button type="button" class="close-btn" aria-label="Cerrar" (click)="onClose()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <form class="modal-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="targetKwhInput">Meta mensual (kWh)</label>
          <input
            id="targetKwhInput"
            name="targetKwhInput"
            type="number"
            min="1"
            step="0.5"
            required
            [(ngModel)]="targetKwhInput"
            placeholder="Ej. 250" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="monthInput">Mes</label>
            <input
              id="monthInput"
              name="monthInput"
              type="number"
              min="1"
              max="12"
              [(ngModel)]="monthInput" />
          </div>
          <div class="form-group">
            <label for="yearInput">Año</label>
            <input
              id="yearInput"
              name="yearInput"
              type="number"
              min="2024"
              max="2035"
              [(ngModel)]="yearInput" />
          </div>
        </div>

        @if (validationError) {
          <p class="form-error" role="alert">{{ validationError }}</p>
        }
        @if (errorMessage) {
          <p class="form-error" role="alert">{{ errorMessage }}</p>
        }

        <div class="modal-actions">
          @if (goal) {
            <button type="button" class="btn-delete" [disabled]="saving" (click)="onDelete()">
              Eliminar meta
            </button>
          }
          <div class="right-actions">
            <button type="button" class="btn-cancel" [disabled]="saving" (click)="onClose()">
              Cancelar
            </button>
            <button type="submit" class="btn-save" [disabled]="saving">
              {{ saving ? 'Guardando...' : 'Guardar meta' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
}
