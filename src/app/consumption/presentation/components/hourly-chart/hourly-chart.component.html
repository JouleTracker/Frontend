<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">{{ title }}</h3>
    <div *ngIf="showRealtimeHeader" class="realtime-header">
      <span class="kw-val">{{ realtimeKw }} kW</span>
      <span class="kw-sub">Ahora mismo</span>
    </div>
  </div>

  <div class="chart-container">
    <canvas
      baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>
  </div>
</div>
