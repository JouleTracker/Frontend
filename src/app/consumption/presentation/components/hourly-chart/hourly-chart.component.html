<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">{{ title || ('CONSUMPTION.HOURLY_TITLE' | translate) }}</h3>
    <div *ngIf="showRealtimeHeader && realtimeKw !== undefined" class="realtime-header">
      <span class="kw-val">{{ realtimeKw }} kW</span>
      <span class="kw-sub">{{ 'CONSUMPTION.REAL_TIME' | translate }}</span>
    </div>
  </div>

  <div class="chart-container">
    <canvas
      baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>
  </div>
</div>
