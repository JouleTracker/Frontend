<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">Comparativa de consumo</h3>
    <span class="chart-unit">kWh</span>
  </div>

  <div class="chart-container">
    <canvas
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
</div>
