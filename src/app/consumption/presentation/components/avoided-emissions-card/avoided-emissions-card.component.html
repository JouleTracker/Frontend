<div class="emissions-card">
  <div class="card-top">
    <div class="leaf-icon-wrapper">
      <mat-icon class="leaf-icon">eco</mat-icon>
    </div>
    <div class="emissions-info">
      <h3 class="card-title">Emisiones evitadas</h3>
      <div class="emissions-val-row">
        <span class="emissions-val">{{ kg }} kg</span>
      </div>
      <span class="emissions-sub">de CO₂ este mes</span>
    </div>
  </div>

  <div class="card-bottom">
    <span class="equivalence-text">{{ equivalence }}</span>
    <div class="tree-illustration" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <!-- Tree crown -->
        <circle cx="32" cy="22" r="16" fill="#22c55e"/>
        <circle cx="20" cy="28" r="12" fill="#16a34a"/>
        <circle cx="44" cy="28" r="12" fill="#15803d"/>
        <circle cx="32" cy="30" r="13" fill="#16a34a"/>
        <!-- Trunk -->
        <rect x="28" y="38" width="8" height="18" rx="2" fill="#78350f"/>
        <path d="M26 56 C28 54, 36 54, 38 56 Z" fill="#451a03"/>
      </svg>
    </div>
  </div>
</div>
